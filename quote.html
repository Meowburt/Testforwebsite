    <!-- AUTOMATIC FORMATTING & SUBMISSION SCRIPTS -->
    <script>
        // 1. Automatically format the phone number as (123) 456-7890 while typing
        const phoneInput = document.getElementById("phoneInput");
        phoneInput.addEventListener('input', function (e) {
            var x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });

        // 2. Silently send data to Formspree, fire Pixel, and open Calendar in a NEW TAB
        const form = document.getElementById("quoteForm");
        const formWrapper = document.getElementById("formWrapper");
        
        form.addEventListener("submit", function(e) {
            e.preventDefault(); // Stops the standard HTML redirect
            
            // Fire the Facebook Pixel
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Lead');
            }

            // Instantly open the Google Calendar scheduling page in a NEW tab to beat popup blockers!
            window.open("https://calendar.app.google/4qtueovMVLreVj7Z6", "_blank");

            // Gather the form data
            const formData = new FormData(form);

            // Send data to Formspree silently in the background
            fetch(form.action, {
                method: form.method,
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(() => {
                // Instantly replace the form on THIS page with a beautiful success message
                formWrapper.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; border-radius: 20px;">
                        <h2 style="color: #2a2d5a; font-family: Georgia, serif; font-size: 32px; margin-bottom: 15px;">Inquiry Sent Successfully!</h2>
                        <p style="color: #2a2d5a; font-family: 'Helvetica Neue', Helvetica, sans-serif; font-size: 18px; line-height: 1.5; margin-bottom: 25px;">
                            Your calendar scheduling page has been securely opened in a new tab.<br>You can safely close this tab or keep exploring the website!
                        </p>
                        <p style="font-size: 14px; color: #555; font-family: 'Helvetica Neue', Helvetica, sans-serif;">
                            (If your browser blocked the new tab, <a href="https://calendar.app.google/4qtueovMVLreVj7Z6" target="_blank" style="color: #d16b8a; font-weight: bold; text-decoration: underline;">click here to schedule your time</a>).
                        </p>
                        <a href="index.html" style="display: inline-block; margin-top: 20px; background-color: transparent; border: 2px solid #d16b8a; color: #d16b8a; padding: 10px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; font-family: 'Helvetica Neue', Helvetica, sans-serif;">&larr; Back to Home</a>
                    </div>
                `;
            }).catch((error) => {
                console.error("Form error:", error);
                // Fallback message just in case their internet drops
                formWrapper.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px;">
                        <h2 style="color: #2a2d5a; font-family: Georgia, serif; font-size: 28px;">Form processed!</h2>
                        <p style="font-family: 'Helvetica Neue', Helvetica, sans-serif;">Make sure to check the new tab to pick your consultation time. <br><a href="https://calendar.app.google/4qtueovMVLreVj7Z6" target="_blank" style="color: #d16b8a; font-weight: bold;">Click here if it didn't open.</a></p>
                    </div>
                `;
            });
        });
    </script>
